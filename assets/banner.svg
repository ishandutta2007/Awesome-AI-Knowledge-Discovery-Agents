<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }
    .pulse-orb {
      animation: pulseAnimation 6s ease-in-out infinite alternate;
    }
    .orbit-node {
      animation: orbitFloat 8s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dashMove 20s linear infinite;
    }

    @keyframes pulseAnimation {
      0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.45; }
      100% { transform: scale(0.95) translate(-10px, 15px); opacity: 0.3; }
    }

    @keyframes orbitFloat {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(6px) rotate(-1deg); }
    }

    @keyframes dashMove {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Cybernetic Grid Lines -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Background Ambient Glowing Orbs (Dynamic Pulse in Background) -->
  <g filter="url(#glow)">
    <circle cx="180" cy="110" r="130" fill="#38bdf8" class="pulse-orb" opacity="0.2" />
    <circle cx="1020" cy="300" r="160" fill="#a855f7" class="pulse-orb" opacity="0.22" style="animation-delay: -3s;" />
    <circle cx="600" cy="390" r="110" fill="#06b6d4" class="pulse-orb" opacity="0.18" style="animation-delay: -1.5s;" />
  </g>

  <!-- Animated Data Flow Rays Behind Text -->
  <g class="flow-line" opacity="0.35">
    <path d="M 50 180 Q 300 60 600 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 50 240 Q 350 340 650 240 T 1150 240" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Subtle Network Graph Nodes (Behind Title) -->
  <g class="orbit-node" opacity="0.5">
    <circle cx="95" cy="80" r="4" fill="#38bdf8" />
    <circle cx="210" cy="50" r="3" fill="#818cf8" />
    <line x1="95" y1="80" x2="210" y2="50" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

    <circle cx="1080" cy="100" r="5" fill="#c084fc" />
    <circle cx="1140" cy="150" r="3.5" fill="#38bdf8" />
    <line x1="1080" y1="100" x2="1140" y2="150" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <!-- ================= FOREGROUND CONTENT LAYER (Guaranteed High Contrast & Prominence) ================= -->

  <!-- Top Badge: Category Pill -->
  <g transform="translate(600, 52)">
    <rect x="-175" y="-16" width="350" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="-150" cy="0" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-135" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="1.5">ENTERPRISE SEARCH &#8226; AGENTIC RAG &#8226; ACL</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryTextGrad)" filter="url(#softGlow)" letter-spacing="-0.5">
    AI KNOWLEDGE DISCOVERY AGENTS
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Next-Gen Enterprise Search, Hybrid RAG with Citations, Permission-Aware Graph Retrieval
  </text>

  <!-- Secondary Highlights Line -->
  <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8">
    Curated SaaS Category Leaders &amp; Production-Ready Open-Source Systems
  </text>

  <!-- ================= FEATURE HIGHLIGHT PILLS (With Vector Icons) ================= -->
  <g transform="translate(0, 260)">
    <!-- Pill 1: Permission-Aware ACL -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="200" height="42" rx="10" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <!-- Shield Vector Icon -->
      <path d="M 22 15 L 30 11 L 38 15 C 38 23 30 28 30 28 C 30 28 22 23 22 15 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round" />
      <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Permission-Aware ACL
      </text>
    </g>

    <!-- Pill 2: Hybrid RAG & Graphs -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="url(#pillGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <!-- Graph Network Vector Icon -->
      <circle cx="24" cy="16" r="3" fill="#818cf8" />
      <circle cx="34" cy="24" r="3" fill="#818cf8" />
      <circle cx="20" cy="27" r="2.5" fill="#818cf8" />
      <line x1="24" y1="16" x2="34" y2="24" stroke="#818cf8" stroke-width="1.5" />
      <line x1="24" y1="16" x2="20" y2="27" stroke="#818cf8" stroke-width="1.5" />
      <line x1="20" y1="27" x2="34" y2="24" stroke="#818cf8" stroke-width="1.5" />
      <text x="120" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Hybrid RAG &amp; Graphs
      </text>
    </g>

    <!-- Pill 3: Autonomous Agents -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="210" height="42" rx="10" fill="url(#pillGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
      <!-- Bot Head Vector Icon -->
      <rect x="20" y="14" width="16" height="13" rx="2" fill="none" stroke="#c084fc" stroke-width="1.8" />
      <circle cx="24.5" cy="19.5" r="1.5" fill="#c084fc" />
      <circle cx="31.5" cy="19.5" r="1.5" fill="#c084fc" />
      <line x1="28" y1="11" x2="28" y2="14" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="28" cy="10" r="1.5" fill="#c084fc" />
      <text x="115" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Autonomous Agents
      </text>
    </g>

    <!-- Pill 4: Model Context Protocol -->
    <g transform="translate(830, 0)">
      <rect x="0" y="0" width="230" height="42" rx="10" fill="url(#pillGrad)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
      <!-- Lightning Bolt Vector Icon -->
      <polygon points="26,12 20,21 25,21 23,28 30,19 25,19" fill="#06b6d4" />
      <text x="125" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        MCP Protocol Integration
      </text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(600, 355)">
    <text x="0" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748b" letter-spacing="1">
      50+ ENTERPRISE CONNECTORS &#8226; 100% PRIVATE AIR-GAPPED &#8226; LOCAL &amp; CLOUD LLMs
    </text>
    <!-- Cyan & Purple Glow Bottom Indicator Line -->
    <line x1="-300" y1="18" x2="300" y2="18" stroke="url(#primaryTextGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
